[project]
name = "arch-plan"
version = "0.1.0"
description = "ARCH: hybrid task planning with uncertainty augmentation, plan adaptation and LLM-generated explanations"
readme = "README.md"
requires-python = ">=3.10"


# Direct dependencies only (what the code imports or runs). Lower bounds are the
# versions ARCH was developed and tested with; pip resolves the transitive ones.
dependencies = [
    # REST API and web app (the "standard" extra provides the `fastapi` CLI,
    # uvicorn and python-multipart for file uploads)
    "fastapi[standard]>=0.116.1,<1",
    "pydantic>=2.11.7,<3",
    # Planning
    "unified-planning>=1.2.0,<2",
    "up-aries>=0.4.0",
    "up-enhsp>=0.0.27",
    "up-fmap>=0.0.13",
    "up-pyperplan>=1.1.0",
    "up-symk>=1.3.1",
    "ortools>=9.14.6206,<10",
    # Constraint programming model that checks the mission constraints when retries are added
    "cpmpy>=1.1.1,<2",
    # SMT solver used by TemPEST through PySMT
    "z3-solver>=4.15.0.0",
    # Plots
    "matplotlib>=3.7.3,<4",
    # LLM explanations
    "google-genai>=1.60.0,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


# NOTE: TemPEST (apps/tempest, at the root of the project) is a vendored third-party package and is
# installed separately, because a relative local path cannot be declared as a
# dependency here. It pulls the PySMT commit it needs:
#     pip install ./apps/tempest

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
]
# Jupyter kernel needed to run run_planner.ipynb
notebook = [
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["arch_plan*"]
# Folders with data files only (declared below as package data)
exclude = ["arch_plan.static*", "arch_plan.llm.assets*"]

# Non-Python files shipped inside the package
[tool.setuptools.package-data]
arch_plan = [
    "static/**/*",
    "llm/assets/prompt-instructions.txt",
    "llm/assets/example.json",
]
